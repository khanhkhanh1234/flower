# Render Blueprint — gói Free. Dữ liệu ở Supabase (Postgres + Storage), Render chỉ chạy app.
services:
  - type: web
    name: floral-muse
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      # Các giá trị bí mật — điền trên giao diện Render khi tạo Blueprint:
      - key: DATABASE_URL # Supabase → Connect → Session pooler (port 5432)
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SECRET_KEY # Supabase → Settings → API Keys → Secret key (sb_secret_...)
        sync: false
      - key: GEMINI_API_KEY # tùy chọn, lấy ở aistudio.google.com/apikey
        sync: false
